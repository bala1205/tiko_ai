name: tiko
description: Tiko AI - Modern AI Chat Assistant powered by NVIDIA NIM (Firebase + Cloudinary)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.1

  # State management
  flutter_riverpod: ^2.5.1

  # UI / Markdown
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2

  # Utilities
  image_picker: ^1.0.8
  uuid: ^4.4.0
  intl: ^0.19.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
